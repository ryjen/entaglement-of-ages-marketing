name: Fix four-book hero refresh

on:
  push:
    branches:
      - art/four-book-hero-refresh-2026-09-12

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix public language and series metadata
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import hashlib
          import json

          for path in Path('src').rglob('*.html'):
              text = path.read_text()
              text = text.replace('Roman-inspired river city', 'Aurelian river city')
              path.write_text(text)

          manifest_path = Path('public-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          by_id = {entry['id']: entry for entry in manifest['artifacts']}
          by_id['style-trilogy-pages-v1']['title'] = 'Series overview pages v1'
          by_id['style-trilogy-pages-v1']['summary'] = 'Shared four-age hero treatment for series-level overview pages.'
          by_id['style-hero-media-v1']['summary'] = 'Shared responsive positioning, overlays, accessibility behavior, and crop rules for series hero illustrations.'
          by_id['style-home-v2']['summary'] = 'Screen-first homepage hierarchy with integrated navigation, centered cinematic hero, compact four-book series panels, and an intentional recurring-question section.'
          by_id['style-arcs-v1']['summary'] = 'Responsive homepage presentation for premise-level thematic arcs shared across the four-book cycle.'

          for artifact in manifest['artifacts']:
              path = Path(artifact['path']) if isinstance(artifact.get('path'), str) else None
              if artifact.get('approval_state') in {'approved', 'published'} and path and path.is_file():
                  artifact['checksum_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          PY
      - name: Validate fix
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node tools/validate-media-integrity.mjs
          node tools/validate-manifest-checksums.mjs
          node tools/site.mjs source
          node tools/validate-canonical-origin.mjs
          node tools/validate-public-language.mjs
          node --test tests/*.test.mjs
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public-manifest.json
          git rm .github/workflows/fix-four-book-hero-refresh.yml
          git diff --cached --check
          git commit -m 'Fix hero refresh public-language contract'
          git push origin HEAD:${GITHUB_REF_NAME}
