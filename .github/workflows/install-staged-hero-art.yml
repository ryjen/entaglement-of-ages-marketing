name: Install staged hero artwork

on:
  push:
    branches:
      - art/refresh-series-website-heroes-2026-09

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Decode and install staged artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f .artwork-staging/READY
          mkdir -p src/media/heroes

          {
            git show 972700819e2361906fc3a240f2ab18d421a10bba:.artwork-staging/age-of-embers-000.b64
            git show 3299ecf5b65b74a09d746d4eec4d0590921a2132:.artwork-staging/age-of-embers-001.b64
            git show 7c8112b4f8fdd57f2b639371d8817f82c5e1a4ce:.artwork-staging/age-of-embers-002.b64
            git show 5c2b6e69658e53368ff214e8cf731d58fbcd4411:.artwork-staging/age-of-embers-003.b64
          } | base64 --decode > src/media/heroes/age-of-embers-hero.webp

          {
            git show 48bb1aed591ecf73646fa6c055410e9a4acb5194:.artwork-staging/fatherless-original-000.b64
            git show 950e0a75a6ab64feef8c65e7f46e2f2c68d8dcfb:.artwork-staging/fatherless-original-001.b64
            git show 620287b69c5a479124210bb34b1f29ceb826a9f1:.artwork-staging/fatherless-original-002.b64
          } | base64 --decode > src/media/heroes/fatherless-original-hero.webp

          {
            git show bf52d989ee5042bb2b68ef9facda70399ec59644:.artwork-staging/neurion-000.b64
            git show 331b4af04313d562cbeefa8bc216914064db9903:.artwork-staging/neurion-001.b64
            git show 3f09c7242c984a0d0e91ff6ced7c9f3795781c88:.artwork-staging/neurion-002.b64
          } | base64 --decode > src/media/heroes/neurion-hero.webp

          cat .artwork-staging/age-of-forms-* | base64 --decode > src/media/heroes/age-of-forms-hero.webp

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          heroes = {
              'hero-age-of-embers': root / 'src/media/heroes/age-of-embers-hero.webp',
              'hero-original': root / 'src/media/heroes/fatherless-original-hero.webp',
              'hero-neurion': root / 'src/media/heroes/neurion-hero.webp',
              'hero-age-of-forms': root / 'src/media/heroes/age-of-forms-hero.webp',
          }
          for path in heroes.values():
              data = path.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', path
              assert int.from_bytes(data[4:8], 'little') + 8 == len(data), path
              assert b'EXIF' not in data and b'XMP ' not in data, path

          home = root / 'src/index.html'
          text = home.read_text()
          marker = '      <article class="era-card" data-era="forms">\n        <div class="era-card__copy">'
          replacement = '      <article class="era-card" data-era="forms">\n        <figure class="era-card__media"><img src="media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="An abundant advanced terrace-city of water, greenery, bridges, and public life beneath a vast inherited orbital ring." loading="lazy" decoding="async"></figure>\n        <div class="era-card__copy">'
          if marker in text:
              text = text.replace(marker, replacement, 1)
          home.write_text(text)

          books = root / 'src/books/index.html'
          text = books.read_text()
          marker = '        <img src="../media/heroes/neurion-hero.webp" width="1200" height="675" alt="" decoding="async">\n'
          addition = marker + '        <img src="../media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="" decoding="async">\n'
          if 'age-of-forms-hero.webp' not in text:
              text = text.replace(marker, addition, 1)
          books.write_text(text)

          forms = root / 'src/books/age-of-forms/index.html'
          text = forms.read_text().replace('width="960" height="540"', 'width="640" height="360"')
          forms.write_text(text)

          css = root / 'src/styles/trilogy-pages.v1.css'
          css.write_text(css.read_text().replace('grid-template-columns:repeat(3,1fr)', 'grid-template-columns:repeat(4,1fr)'))

          manifest_path = root / 'public-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          by_id = {item['id']: item for item in manifest['artifacts']}
          for artifact_id, path in heroes.items():
              by_id[artifact_id]['checksum_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          for artifact_id, path in {
              'site-placeholder-home': home,
              'site-placeholder-books': books,
              'site-book-age-of-forms': forms,
              'style-trilogy-pages-v1': css,
          }.items():
              by_id[artifact_id]['checksum_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')))
          PY

          rm -rf .artwork-staging
          rm -f .tmp-ignore .tmp-ignore-2 .tmp-ignore-3 .tmp-ignore-4 .tmp-ignore-5 .tmp-ignore-6
          rm -f .github/workflows/install-staged-hero-art.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: install validated website hero artwork'
          git push origin HEAD:${GITHUB_REF_NAME}
