name: Normalize four-book series migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/series-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Rebind manifest and canonical sitemap routes
        run: node tools/migrate-four-book-series.mjs

      - name: Commit normalized migration state
        run: |
          if git diff --quiet -- public-manifest.json src/sitemap.xml; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-manifest.json src/sitemap.xml
          git commit -m 'chore: rebind four-book public manifest'
          git push origin HEAD:main
