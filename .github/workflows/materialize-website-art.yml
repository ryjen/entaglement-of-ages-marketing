name: Materialize website artwork

on:
  push:
    branches:
      - art/update-website-heroes-2026-09
    paths:
      - src/media/heroes/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire four-book website artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          assets = {
              'age-of-embers-hero.webp': ('hero-age-of-embers', 'Age of Embers hero', 'Project-generated cinematic website artwork of glacial migration beneath a red eclipse over a frozen sea.', '1bd5f71ab5565ccf3af05ee80fb1fcb7d2c9d4d13ba882cd86436b2f557a2ea9'),
              'fatherless-original-hero.webp': ('hero-original', 'The Fatherless original hero', 'Project-generated cinematic website artwork of the Aurelian Republic as an immense civic river city at dusk.', '5b5df67007cf1fe9eb8e76770a013e2d0fcd961a9992a6de8f41cf6bcdf0c48c'),
              'neurion-hero.webp': ('hero-neurion', 'Neurion hero', 'Project-generated cinematic website artwork of a distributed future metropolis spanning cliffs, water, and networked infrastructure.', 'af3bfbecb045b7deaee3ceec5f71b16124ed5fc83982e393d3a2fe501f3d43a2'),
              'age-of-forms-hero.webp': ('hero-age-of-forms', 'The Age of Forms hero', 'Project-generated cinematic website artwork of a materially abundant later-age city shaped by inherited advanced systems and social comparison.', '9b12f52fcd25ba7247987fd79f841b47efaa82f14d0a8d91cdad6e302958b7bb'),
          }

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          hero_dir = root / 'src' / 'media' / 'heroes'
          for filename, (_, _, _, expected) in assets.items():
              path = hero_dir / filename
              if not path.is_file():
                  raise SystemExit(f'missing hero asset: {path}')
              data = path.read_bytes()
              if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'invalid WebP signature: {path}')
              if int.from_bytes(data[4:8], 'little') + 8 != len(data):
                  raise SystemExit(f'malformed WebP: {path}')
              actual = sha256(path)
              if actual != expected:
                  raise SystemExit(f'unexpected hero checksum for {filename}: {actual}')

          alt_replacements = {
              'A line of people crosses a dark glacial plain beneath jagged mountains and a red streak in a stormy sky.':
                  'A small migrating group crosses a frozen coastal wilderness beneath jagged mountains and a red eclipse reflected across dark water.',
              'Masked elites recline with wine on a high terrace while attendants serve them above a crowded civic avenue lined with guards and public punishment structures.':
                  'An immense river city of stone temples, bridges, civic crowds, banners, and torchlight gathers beneath a darkening sky.',
              'A crowd moves through a broad civic plaza beneath a dark blue skyline of scattered lights and storm clouds.':
                  'A vast blue-lit future city spans cliffs and waterfalls beneath a planetary sky, with people overlooking its distributed towers and transit.',
          }
          for html in (root / 'src').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for old, new in alt_replacements.items():
                  text = text.replace(old, new)
              html.write_text(text, encoding='utf-8')

          home = root / 'src' / 'index.html'
          text = home.read_text(encoding='utf-8')
          marker = '      <article class="era-card" data-era="forms">\n        <div class="era-card__copy">'
          replacement = (
              '      <article class="era-card" data-era="forms">\n'
              '        <figure class="era-card__media"><img src="media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="A bright terraced future city of water, gardens, elevated transit, and civic crowds extends beneath a vast orbital ring." loading="lazy" decoding="async"></figure>\n'
              '        <div class="era-card__copy">'
          )
          if marker not in text:
              raise SystemExit('Book IV homepage card marker not found')
          home.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          books = root / 'src' / 'books' / 'index.html'
          text = books.read_text(encoding='utf-8')
          marker = '        <img src="../media/heroes/neurion-hero.webp" width="1200" height="675" alt="" decoding="async">'
          replacement = marker + '\n        <img src="../media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="" decoding="async">'
          if marker not in text:
              raise SystemExit('books overview hero marker not found')
          books.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          css = root / 'src' / 'styles' / 'trilogy-pages.v1.css'
          text = css.read_text(encoding='utf-8')
          marker = 'grid-template-columns:repeat(3,1fr)'
          if marker not in text:
              raise SystemExit('books overview grid marker not found')
          css.write_text(text.replace(marker, 'grid-template-columns:repeat(4,1fr)', 1), encoding='utf-8')

          forms = root / 'src' / 'books' / 'age-of-forms' / 'index.html'
          text = forms.read_text(encoding='utf-8')
          og_url = '  <meta property="og:url" content="https://fatherless.ryanjennin.gs/books/age-of-forms/">'
          text = text.replace(og_url, og_url + '\n  <meta property="og:image" content="https://fatherless.ryanjennin.gs/media/heroes/age-of-forms-hero.webp">', 1)
          text = text.replace('<meta name="twitter:card" content="summary">', '<meta name="twitter:card" content="summary_large_image">', 1)
          twitter_desc = '  <meta name="twitter:description" content="Humanity solves much of material scarcity. It does not solve the need to matter.">'
          text = text.replace(twitter_desc, twitter_desc + '\n  <meta name="twitter:image" content="https://fatherless.ryanjennin.gs/media/heroes/age-of-forms-hero.webp">', 1)
          json_url = '    "url": "https://fatherless.ryanjennin.gs/books/age-of-forms/",'
          text = text.replace(json_url, json_url + '\n    "image": "https://fatherless.ryanjennin.gs/media/heroes/age-of-forms-hero.webp",', 1)
          trilogy_css = '  <link rel="stylesheet" href="../../styles/trilogy-pages.v1.css">'
          text = text.replace(trilogy_css, trilogy_css + '\n  <link rel="stylesheet" href="../../styles/hero-media.v1.css">', 1)
          hero_marker = '    <section class="hero trilogy-page-hero" aria-labelledby="page-title">\n      <div class="hero__panel">'
          hero_replacement = (
              '    <section class="hero hero--media" aria-labelledby="page-title">\n'
              '      <figure class="hero__media"><img src="../../media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="A bright terraced future city of water, gardens, elevated transit, and civic crowds extends beneath a vast orbital ring." fetchpriority="high" decoding="async"></figure>\n'
              '      <div class="hero__panel">'
          )
          if hero_marker not in text:
              raise SystemExit('Book IV page hero marker not found')
          forms.write_text(text.replace(hero_marker, hero_replacement, 1), encoding='utf-8')

          manifest_path = root / 'public-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['artifacts']
          by_id = {entry['id']: entry for entry in entries}
          for filename, (artifact_id, title, summary, expected) in assets.items():
              path = f'src/media/heroes/{filename}'
              entry = by_id.get(artifact_id)
              if entry is None:
                  entry = {
                      'id': artifact_id,
                      'path': path,
                      'title': title,
                      'summary': summary,
                      'content_type': 'site-asset',
                      'spoiler_tier': 'premise',
                      'approval_state': 'approved',
                      'rights_status': 'all-rights-reserved-project-artwork',
                      'provenance_class': 'public-native',
                      'publication_date': None,
                      'canonical_url': f'/media/heroes/{filename}',
                      'checksum_sha256': expected,
                      'replacement_status': 'current',
                      'creator_class': 'generated',
                      'rights_basis': 'Project-generated original artwork approved for this public marketing release; no third-party source asset incorporated.',
                      'attribution_required': False,
                      'metadata_review': 'stripped',
                  }
                  entries.append(entry)
                  by_id[artifact_id] = entry
              else:
                  entry.update(path=path, title=title, summary=summary, canonical_url=f'/media/heroes/{filename}', checksum_sha256=expected)

          for entry in entries:
              path = entry.get('path')
              if not isinstance(path, str):
                  continue
              disk = root / path
              if disk.is_file() and entry.get('approval_state') in {'approved', 'published'}:
                  entry['checksum_sha256'] = sha256(disk)
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')), encoding='utf-8')
          PY

      - name: Remove one-shot helper before validation
        run: rm .github/workflows/materialize-website-art.yml

      - name: Install validation dependencies
        run: npm install --no-audit --no-fund

      - name: Validate public media and source contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-media-integrity.mjs
          node tools/site.mjs source
          node tools/validate-release-state.mjs
          node tools/validate-public-language.mjs

      - name: Commit validated website artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'art: refresh website artwork for four-book cycle'
          git push origin HEAD
