name: Materialize website artwork

on:
  push:
    branches:
      - art/update-website-heroes-2026-09
    paths:
      - .tmp-art/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize generated website artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import re

          root = Path('.')
          temp = root / '.tmp-art'
          hero_dir = root / 'src' / 'media' / 'heroes'
          hero_dir.mkdir(parents=True, exist_ok=True)

          assets = {
              'age-of-embers-hero.webp': {
                  'id': 'hero-age-of-embers',
                  'title': 'Age of Embers hero',
                  'summary': 'Project-generated cinematic website artwork of glacial migration beneath a red eclipse over a frozen sea.',
              },
              'fatherless-original-hero.webp': {
                  'id': 'hero-original',
                  'title': 'The Fatherless original hero',
                  'summary': 'Project-generated cinematic website artwork of the Aurelian Republic as an immense civic river city at dusk.',
              },
              'neurion-hero.webp': {
                  'id': 'hero-neurion',
                  'title': 'Neurion hero',
                  'summary': 'Project-generated cinematic website artwork of a distributed future metropolis spanning cliffs, water, and networked infrastructure.',
              },
              'age-of-forms-hero.webp': {
                  'id': 'hero-age-of-forms',
                  'title': 'The Age of Forms hero',
                  'summary': 'Project-generated cinematic website artwork of a materially abundant later-age city shaped by inherited advanced systems and social comparison.',
              },
          }

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for filename in assets:
              parts = sorted(temp.glob(f'{filename}.b64.*'))
              if not parts:
                  raise SystemExit(f'missing staged data for {filename}')
              encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
              data = base64.b64decode(encoded, validate=True)
              if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'invalid WebP payload for {filename}')
              declared = int.from_bytes(data[4:8], 'little') + 8
              if declared != len(data):
                  raise SystemExit(f'malformed WebP payload for {filename}: declared={declared} actual={len(data)}')
              (hero_dir / filename).write_bytes(data)

          alt_replacements = {
              'A line of people crosses a dark glacial plain beneath jagged mountains and a red streak in a stormy sky.':
                  'A small migrating group crosses a frozen coastal wilderness beneath jagged mountains and a red eclipse reflected across dark water.',
              'Masked elites recline with wine on a high terrace while attendants serve them above a crowded civic avenue lined with guards and public punishment structures.':
                  'An immense river city of stone temples, bridges, civic crowds, banners, and torchlight gathers beneath a darkening sky.',
              'A crowd moves through a broad civic plaza beneath a dark blue skyline of scattered lights and storm clouds.':
                  'A vast blue-lit future city spans cliffs and waterfalls beneath a planetary sky, with people overlooking its distributed towers and transit.',
          }

          for html in (root / 'src').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              changed = text
              for old, new in alt_replacements.items():
                  changed = changed.replace(old, new)
              if changed != text:
                  html.write_text(changed, encoding='utf-8')

          home = root / 'src' / 'index.html'
          text = home.read_text(encoding='utf-8')
          forms_marker = '      <article class="era-card" data-era="forms">\n        <div class="era-card__copy">'
          forms_figure = (
              '      <article class="era-card" data-era="forms">\n'
              '        <figure class="era-card__media"><img src="media/heroes/age-of-forms-hero.webp" width="1200" height="675" alt="A bright terraced future city of water, gardens, elevated transit, and civic crowds extends beneath a vast orbital ring." loading="lazy" decoding="async"></figure>\n'
              '        <div class="era-card__copy">'
          )
          if forms_marker not in text:
              raise SystemExit('Book IV home-card marker not found')
          text = text.replace(forms_marker, forms_figure, 1)
          text = text.replace('width="640" height="360" alt="An immense river city', 'width="1200" height="675" alt="An immense river city')
          home.write_text(text, encoding='utf-8')

          books = root / 'src' / 'books' / 'index.html'
          text = books.read_text(encoding='utf-8')
          neurion_img = '        <img src="../media/heroes/neurion-hero.webp" width="1200" height="675" alt="" decoding="async">'
          forms_img = neurion_img + '\n        <img src="../media/heroes/age-of-forms-hero.webp" width="1200" height="675" alt="" decoding="async">'
          if neurion_img not in text:
              raise SystemExit('books hero Neurion marker not found')
          text = text.replace(neurion_img, forms_img, 1)
          text = text.replace('width="640" height="360" alt="" decoding="async">', 'width="1200" height="675" alt="" decoding="async">')
          books.write_text(text, encoding='utf-8')

          css = root / 'src' / 'styles' / 'trilogy-pages.v1.css'
          text = css.read_text(encoding='utf-8')
          if 'grid-template-columns:repeat(3,1fr)' not in text:
              raise SystemExit('trilogy hero grid marker not found')
          css.write_text(text.replace('grid-template-columns:repeat(3,1fr)', 'grid-template-columns:repeat(4,1fr)', 1), encoding='utf-8')

          forms = root / 'src' / 'books' / 'age-of-forms' / 'index.html'
          text = forms.read_text(encoding='utf-8')
          og_marker = '  <meta property="og:url" content="https://fatherless.ryanjennin.gs/books/age-of-forms/">'
          if 'media/heroes/age-of-forms-hero.webp' not in text:
              text = text.replace(
                  og_marker,
                  og_marker + '\n  <meta property="og:image" content="https://fatherless.ryanjennin.gs/media/heroes/age-of-forms-hero.webp">',
                  1,
              )
              text = text.replace('<meta name="twitter:card" content="summary">', '<meta name="twitter:card" content="summary_large_image">', 1)
              twitter_desc = '  <meta name="twitter:description" content="Humanity solves much of material scarcity. It does not solve the need to matter.">'
              text = text.replace(twitter_desc, twitter_desc + '\n  <meta name="twitter:image" content="https://fatherless.ryanjennin.gs/media/heroes/age-of-forms-hero.webp">', 1)
              json_url = '    "url": "https://fatherless.ryanjennin.gs/books/age-of-forms/",'
              text = text.replace(json_url, json_url + '\n    "image": "https://fatherless.ryanjennin.gs/media/heroes/age-of-forms-hero.webp",', 1)
              trilogy_css = '  <link rel="stylesheet" href="../../styles/trilogy-pages.v1.css">'
              text = text.replace(trilogy_css, trilogy_css + '\n  <link rel="stylesheet" href="../../styles/hero-media.v1.css">', 1)
              hero_marker = '    <section class="hero trilogy-page-hero" aria-labelledby="page-title">\n      <div class="hero__panel">'
              hero_replacement = (
                  '    <section class="hero hero--media" aria-labelledby="page-title">\n'
                  '      <figure class="hero__media"><img src="../../media/heroes/age-of-forms-hero.webp" width="1200" height="675" alt="A bright terraced future city of water, gardens, elevated transit, and civic crowds extends beneath a vast orbital ring." fetchpriority="high" decoding="async"></figure>\n'
                  '      <div class="hero__panel">'
              )
              if hero_marker not in text:
                  raise SystemExit('Book IV hero marker not found')
              text = text.replace(hero_marker, hero_replacement, 1)
          forms.write_text(text, encoding='utf-8')

          manifest_path = root / 'public-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['artifacts']
          by_id = {entry['id']: entry for entry in entries}

          for filename, spec in assets.items():
              path = f'src/media/heroes/{filename}'
              checksum = sha256(root / path)
              entry = by_id.get(spec['id'])
              if entry is None:
                  entry = {
                      'id': spec['id'],
                      'path': path,
                      'title': spec['title'],
                      'summary': spec['summary'],
                      'content_type': 'site-asset',
                      'spoiler_tier': 'premise',
                      'approval_state': 'approved',
                      'rights_status': 'all-rights-reserved-project-artwork',
                      'provenance_class': 'public-native',
                      'publication_date': None,
                      'canonical_url': f'/media/heroes/{filename}',
                      'checksum_sha256': checksum,
                      'replacement_status': 'current',
                      'creator_class': 'generated',
                      'rights_basis': 'Project-generated original artwork approved for this public marketing release; no third-party source asset incorporated.',
                      'attribution_required': False,
                      'metadata_review': 'stripped',
                  }
                  entries.append(entry)
                  by_id[spec['id']] = entry
              else:
                  entry['path'] = path
                  entry['title'] = spec['title']
                  entry['summary'] = spec['summary']
                  entry['checksum_sha256'] = checksum
                  entry['canonical_url'] = f'/media/heroes/{filename}'

          # Recompute all authoritative checksums after public source updates.
          for entry in entries:
              path = entry.get('path')
              if not isinstance(path, str):
                  continue
              disk = root / path
              if not disk.is_file():
                  continue
              if entry.get('approval_state') in {'approved', 'published'}:
                  entry['checksum_sha256'] = sha256(disk)

          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')), encoding='utf-8')
          PY

      - name: Validate public media and source contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-media-integrity.mjs
          node tools/site.mjs source

      - name: Commit materialized artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-manifest.json src/
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'art: refresh website artwork for four-book cycle'
          git push origin HEAD
