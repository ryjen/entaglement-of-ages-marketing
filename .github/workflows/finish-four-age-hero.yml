name: Finish four-age hero integration

on:
  push:
    branches:
      - art/refresh-series-website-heroes-2026-09

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Complete four-age surfaces and contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          overview_pages = [
              root/'src/world/index.html',
              root/'src/about/index.html',
              root/'src/news/index.html',
              root/'src/press/index.html',
          ]
          neurion = '        <img src="../media/heroes/neurion-hero.webp" width="1200" height="675" alt="" decoding="async">\n'
          forms = '        <img src="../media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="" decoding="async">\n'
          for path in overview_pages:
              text = path.read_text()
              if 'age-of-forms-hero.webp' not in text:
                  text = text.replace(neurion, neurion + forms, 1)
              path.write_text(text)

          press = root/'src/press/index.html'
          text = press.read_text()
          text = text.replace('Three public hero assets are currently approved for review and coverage reference. Book IV artwork remains in development.', 'Four public hero assets are approved for review and coverage reference.')
          text = text.replace('width="1200" height="675" alt="Glacial migration beneath a low sun and red sky-fire."', 'width="640" height="360" alt="Glacial migration beneath a low sun and red sky-fire."')
          text = text.replace('<small>1200 × 675 WebP · Book I hero</small>', '<small>640 × 360 WebP · Book I hero</small>')
          text = text.replace('width="1200" height="675" alt="A future city reconnecting through many distributed signals."', 'width="640" height="360" alt="A future city reconnecting through many distributed signals."')
          text = text.replace('<small>1200 × 675 WebP · Book III hero</small>', '<small>640 × 360 WebP · Book III hero</small>')
          if 'Book IV hero</small>' not in text:
              marker = '''        <a class="press-asset" href="../media/heroes/neurion-hero.webp" download>\n          <img src="../media/heroes/neurion-hero.webp" width="640" height="360" alt="A future city reconnecting through many distributed signals." loading="lazy">\n          <strong>Neurion</strong>\n          <small>640 × 360 WebP · Book III hero</small>\n        </a>\n'''
              addition = marker + '''        <a class="press-asset" href="../media/heroes/age-of-forms-hero.webp" download>\n          <img src="../media/heroes/age-of-forms-hero.webp" width="640" height="360" alt="An abundant advanced terrace-city of water, greenery, bridges, and public life beneath a vast orbital ring." loading="lazy">\n          <strong>The Age of Forms</strong>\n          <small>640 × 360 WebP · Book IV hero</small>\n        </a>\n'''
              text = text.replace(marker, addition, 1)
          press.write_text(text)

          tests = root/'tests/ux.test.mjs'
          text = tests.read_text()
          text = text.replace("series-level overview pages use the shared three-age hero treatment", "series-level overview pages use the shared four-age hero treatment")
          text = text.replace("/grid-template-columns:repeat\\(3,1fr\\)/, 'trilogy overview hero should present three equal visual ages'", "/grid-template-columns:repeat\\(4,1fr\\)/, 'series overview hero should present four equal visual ages'")
          needle = "    assert.match(html, /neurion-hero\\.webp/, `${pagePath} should include sequel artwork`);\n"
          if 'should include Book IV artwork' not in text:
              text = text.replace(needle, needle + "    assert.match(html, /age-of-forms-hero\\.webp/, `${pagePath} should include Book IV artwork`);\n")
          tests.write_text(text)

          manifest_path = root/'public-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          by_id = {a['id']: a for a in manifest['artifacts']}
          for aid, path in {
              'site-placeholder-world': root/'src/world/index.html',
              'site-placeholder-about': root/'src/about/index.html',
              'site-placeholder-news': root/'src/news/index.html',
              'press-industry': root/'src/press/index.html',
          }.items():
              by_id[aid]['checksum_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          style = by_id.get('style-trilogy-pages-v1')
          if style:
              style['summary'] = 'Shared four-age hero treatment for series-level overview pages.'
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')))
          PY

          rm -f .github/workflows/finish-four-age-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete four-age hero integration'
          git push origin HEAD:${GITHUB_REF_NAME}
